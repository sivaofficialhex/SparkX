<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SparkX — Talk. Listen. Understand.</title>
<meta name="description" content="SparkX is a voice-first AI companion that listens, understands and responds naturally.">
<meta property="og:title" content="SparkX — Talk. Listen. Understand."><meta property="og:description" content="SparkX is a voice-first AI companion that listens, understands and responds naturally."><meta property="og:type" content="website">
<meta name="theme-color" content="#07070f"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#07070f;--fg:#ecebff;--dim:#9a98c4;--a:#7c6cff;--b:#22d3ee;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 25%,#1a1740,var(--bg) 70%);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{min-height:100%;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.05rem;margin:0;letter-spacing:.1em}.sub{color:var(--dim);font-size:.72rem;display:block;letter-spacing:.03em}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.icon{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px;backdrop-filter:blur(10px)}
.hd{display:flex;gap:8px;align-items:center}
.stage{margin:3vh 0 0;display:grid;place-items:center;width:min(60vw,290px);aspect-ratio:1}
.orb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8d2ff,var(--a) 40%,#1e1b4b 85%);box-shadow:0 0 60px 10px rgba(124,108,255,.45),0 0 140px 40px rgba(34,211,238,.15);transition:box-shadow .6s,filter .6s;animation:breathe 5s ease-in-out infinite}
.orb[data-s=listening]{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 80px 20px rgba(34,211,238,.55),0 0 160px 50px rgba(124,108,255,.3)}
.orb.lv[data-s=listening]{animation:none;transform:scale(calc(1 + var(--lv,0)*.32));transition:transform .08s}
.orb[data-s=transcribing],.orb[data-s=thinking]{animation:spin 1.6s linear infinite;background:conic-gradient(from 0deg,var(--a),var(--b),#e879f9,var(--a));filter:blur(1px) saturate(1.2)}
.orb[data-s=speaking]{animation:talk .55s ease-in-out infinite;box-shadow:0 0 90px 25px rgba(232,121,249,.5),0 0 170px 55px rgba(124,108,255,.35)}
@keyframes breathe{50%{transform:scale(1.05)}}@keyframes pulse{50%{transform:scale(1.13)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.1)}60%{transform:scale(.97)}}
#status{margin:12px 0 0;font-size:1.1rem;letter-spacing:.04em;min-height:1.7em}
#err{color:#fda4af;min-height:1.3em;text-align:center;font-size:.9rem;margin:0 0 4px}
.ctl{display:flex;align-items:center;gap:16px;margin-top:2px}
#mic{width:80px;height:80px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 0 30px rgba(124,108,255,.6);transition:transform .15s,opacity .3s}
#mic:active{transform:scale(.92)}#mic:disabled{opacity:.45;cursor:not-allowed}
#mic[aria-pressed=true]{box-shadow:0 0 50px rgba(34,211,238,.8)}#mic svg{width:32px;height:32px;fill:#fff}
#livebtn{border-radius:999px;padding:12px 18px}#livebtn.on{background:#be123c;border-color:#fb7185}
#cap{color:var(--dim);font-style:italic;min-height:1.4em;text-align:center;margin:10px 0 0}
#log{width:100%;margin-top:8px;flex:1;overflow-y:auto;max-height:30vh;padding:6px 2px;scroll-behavior:smooth}
.m{margin:0 0 12px}.m b{display:block;font-size:.66rem;letter-spacing:.18em;color:var(--dim);font-weight:600}.m.sx b{color:var(--b)}
.m p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.panel{position:fixed;inset:auto 0 0 0;max-width:640px;margin:0 auto;max-height:82vh;overflow-y:auto;background:rgba(18,16,40,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);display:none;z-index:5}
.panel.open{display:block}.panel label{display:block;margin:10px 0 4px;color:var(--dim);font-size:.85rem}
.panel select,.panel input[type=range]{width:100%}.panel select{background:#0f0e22;border:1px solid var(--line);border-radius:10px;padding:9px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row button{flex:1;min-width:110px}
.ov{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#1a1740,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:9;text-align:center}
.ov.hide{display:none}.mini{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8d2ff,var(--a) 40%,#1e1b4b 85%);box-shadow:0 0 50px 8px rgba(124,108,255,.5);animation:breathe 5s infinite}
.ov input{width:min(320px,90vw);padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:center;font-size:1.05rem}
.go{width:min(320px,90vw);padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:600;color:#06060f}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.av{font-size:1.4rem;padding:6px 10px}.av.sel{outline:2px solid var(--b)}#avs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.sug button{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem}
html[data-t=cyan]{--a:#0ea5e9;--b:#2dd4bf}html[data-t=rose]{--a:#f43f5e;--b:#fb923c}html[data-t=green]{--a:#10b981;--b:#a3e635}
.gh{margin:16px 0 0;font-size:.7rem;letter-spacing:.18em;color:var(--b)}.m p{cursor:pointer}
</style></head>
<body>
<div id="login" class="ov hide" role="dialog" aria-label="Sign in">
<div class="mini"></div><h1 style="font-size:1.6rem">SPARKX</h1><span class="sub">Talk. Listen. Understand.</span>
<div id="avs" aria-label="Pick an avatar"></div><input id="nm" maxlength="30" placeholder="Un peyar enna?" aria-label="Your name" autocomplete="nickname">
<button class="go" id="go">Continue</button><div class="chips" id="chips" aria-label="Saved profiles"></div>
<span class="sub">Profile & chats intha phone-la mattum save aagum.</span></div>
<main>
<header><h1>SPARKX<span class="sub">Talk. Listen. Understand.</span></h1>
<div class="hd"><button class="icon" id="who" aria-label="Profile"></button><button class="icon" id="gear" aria-label="Open settings" aria-expanded="false">⚙</button></div></header>
<div class="stage"><div class="orb" id="orb" data-s="idle" role="img" aria-label="SparkX orb"></div></div>
<div id="status" role="status" aria-live="polite">Tap to talk</div>
<p id="err" role="alert"></p>
<div class="ctl"><button id="mic" aria-label="Tap to talk" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/></svg></button>
<button class="icon" id="livebtn" aria-pressed="false">🎧 Live talk</button></div>
<p id="cap" aria-live="polite"></p><div class="sug" id="sug" aria-label="Suggestions"></div>
<section id="log" aria-label="Conversation" aria-live="polite"></section>
<section class="panel" id="panel" aria-label="Settings">
<p class="gh">AI</p><label for="mode">Mode</label><select id="mode"><option value="friend">Friend — casual</option><option value="tutor">Tutor — explains</option><option value="coach">Coach — motivates</option></select>
<label for="lang">Language</label><select id="lang"><option value="auto">Auto (mirror me)</option><option value="en">English</option><option value="tanglish">Tanglish</option><option value="ta">தமிழ் (Tamil)</option></select>
<label for="len">Reply length</label><select id="len"><option value="short">Short</option><option value="normal">Normal</option><option value="detailed">Detailed</option></select><p class="gh">VOICE</p><label for="voice">Voice</label><select id="voice"></select>
<label for="rate">Speech rate</label><input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1">
<label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.05" value="1">
<label><input id="auto" type="checkbox" checked> Auto-speak replies</label>
<label><input id="caps" type="checkbox" checked> Show live captions</label><label><input id="hap" type="checkbox" checked> Vibrate on listen / reply</label><p class="gh">LOOK & INPUT</p><label for="theme">Theme</label><select id="theme"><option value="violet">Violet</option><option value="cyan">Ocean</option><option value="rose">Sunset</option><option value="green">Forest</option></select><label><input id="tbar" type="checkbox"> Show type box</label><p class="gh">DATA</p>
<div class="row"><button class="icon" id="stop">Stop speaking</button><button class="icon" id="clear">Clear chat</button><button class="icon" id="export">Export chat</button><button class="icon" id="logout">Switch user</button><button class="icon" id="wipe">Delete my data</button><button class="icon" id="close">Close</button></div>
</section></main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const orb=$('orb'),statusEl=$('status'),errEl=$('err'),mic=$('mic'),cap=$('cap'),log=$('log'),livebtn=$('livebtn');
const LABEL={idle:'Tap to talk',listening:'Listening…',transcribing:'Transcribing…',thinking:'Thinking…',speaking:'Speaking…'};
const ls={g:(k,d)=>{try{return localStorage.getItem('sx_'+k)??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem('sx_'+k,v)}catch{}}};
let user='',history=[],state='idle',rec=null,heard='',cancelled=false,voices=[],ctrl=null,live=false,noSp=0,stream=null,ac=null,an=null,raf=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,synth=window.speechSynthesis;
const showErr=t=>{errEl.textContent=t||''};
const vib=n=>{try{if($('hap').checked&&navigator.vibrate)navigator.vibrate(n)}catch{}};
const stripMd=t=>t.replace(/```[\s\S]*?```/g,' ').replace(/`([^`]*)`/g,'$1').replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^\s{0,3}#{1,6}\s*/gm,'').replace(/(\*\*|__|\*|_|~~)/g,'').replace(/^\s*[-*+•]\s+/gm,'').replace(/^\s*>\s?/gm,'').replace(/\s+/g,' ').trim();
function set(s){state=s;orb.dataset.s=s;statusEl.textContent=(live&&s==='idle')?'Live — go ahead…':LABEL[s];mic.setAttribute('aria-pressed',s==='listening');
 mic.disabled=s==='transcribing'||s==='thinking';
 mic.setAttribute('aria-label',s==='listening'?'Listening, tap to stop':s==='speaking'?'Tap to interrupt and talk':'Tap to talk');
 if(s==='idle'&&live)setTimeout(()=>{if(live&&state==='idle')startListening()},350);}
function add(who,text){const d=document.createElement('div');d.className='m '+(who==='YOU'?'you':'sx');
 const b=document.createElement('b');b.textContent=who;const p=document.createElement('p');p.textContent=who==='YOU'?text:stripMd(text);p.title='Tap to copy';p.onclick=()=>{try{navigator.clipboard.writeText(p.textContent);cap.textContent='Copied ✓';setTimeout(()=>{cap.textContent=''},1200)}catch{}};d.append(b,p);log.append(d);log.scrollTop=log.scrollHeight;sugUpdate()}
function sugUpdate(){$('sug').style.display=log.children.length?'none':'flex'}
const renderLog=()=>{log.innerHTML='';history.forEach(m=>add(m.role==='user'?'YOU':'SPARKX',m.text));sugUpdate()};
const saveHist=()=>{history=history.slice(-40);ls.s('h_'+user,JSON.stringify(history))};

// ---- profile ----
function login(n){n=(n||'').trim().replace(/\s+/g,' ').slice(0,30);if(!n)return;user=n;ls.s('cur',n);
 let u=[];try{u=JSON.parse(ls.g('users','[]'))}catch{}if(!u.includes(n)){u.push(n);ls.s('users',JSON.stringify(u.slice(-8)))}
 try{history=JSON.parse(ls.g('h_'+n,'[]'))}catch{history=[]}
 $('who').textContent=ls.g('av_'+n,'😀')+' '+n;$('login').classList.add('hide');renderLog();showErr('');}
function showLogin(){let u=[];try{u=JSON.parse(ls.g('users','[]'))}catch{}const c=$('chips');c.innerHTML='';
 u.forEach(n=>{const b=document.createElement('button');b.className='icon';b.textContent=ls.g('av_'+n,'😀')+' '+n;b.onclick=()=>login(n);c.append(b)});
 $('login').classList.remove('hide');$('nm').value='';$('nm').focus()}
let av='😀';[...'😀😎🦊🐼🚀🌸'.match(/./gu)].forEach(e=>{const b=document.createElement('button');b.type='button';b.className='icon av';b.textContent=e;b.setAttribute('aria-label','Avatar '+e);b.onclick=()=>{av=e;[...$('avs').children].forEach(x=>x.classList.toggle('sel',x===b))};if(e===av)b.classList.add('sel');$('avs').append(b)});
const doLogin=()=>{const n=$('nm').value.trim().replace(/\s+/g,' ').slice(0,30);if(!n)return;ls.s('av_'+n,av);login(n)};
$('go').onclick=doLogin;$('nm').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('logout').onclick=()=>{endLive();ls.s('cur','');$('panel').classList.remove('open');history=[];log.innerHTML='';showLogin()};
$('who').onclick=()=>$('gear').click();
$('wipe').onclick=()=>{if(!confirm('Delete '+user+' profile and chats from this phone?'))return;endLive();try{localStorage.removeItem('sx_h_'+user);localStorage.removeItem('sx_av_'+user);ls.s('users',JSON.stringify(JSON.parse(ls.g('users','[]')).filter(n=>n!==user)))}catch{}ls.s('cur','');$('panel').classList.remove('open');history=[];log.innerHTML='';showLogin()};

// ---- TTS ----
function loadVoices(){voices=synth?synth.getVoices():[];const sel=$('voice');sel.innerHTML='';sel.add(new Option('Auto (best match)',''));
 voices.forEach(v=>sel.add(new Option(`${v.name} (${v.lang})`,v.voiceURI)));sel.value=ls.g('voice','')}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
function pickVoice(t){const uri=$('voice').value;if(uri)return voices.find(v=>v.voiceURI===uri);
 const ta=/[\u0B80-\u0BFF]/.test(t)||$('lang').value==='ta';for(const p of(ta?['ta']:['en-IN','en'])){const v=voices.find(v=>v.lang.startsWith(p));if(v)return v}return null}
function stopSpeaking(){if(synth)synth.cancel();if(state==='speaking')set('idle')}
function speak(text){const clean=stripMd(text);
 if(!synth||!clean||!$('auto').checked){set('idle');return}
 try{synth.cancel();const u=new SpeechSynthesisUtterance(clean),v=pickVoice(clean);
  if(v){u.voice=v;u.lang=v.lang}else if(/[\u0B80-\u0BFF]/.test(clean))u.lang='ta-IN';
  u.rate=+$('rate').value;u.volume=+$('vol').value;u.onstart=()=>set('speaking');
  u.onend=()=>{if(state==='speaking')set('idle')};
  u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')showErr('Voice playback failed — reply is shown as text.');if(state==='speaking')set('idle')};
  set('speaking');synth.speak(u)}catch{showErr('Voice playback failed — reply is shown as text.');set('idle')}}

// ---- AI ----
async function ask(text){set('thinking');showErr('');ctrl=new AbortController();
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
  body:JSON.stringify({message:text,conversation:history.slice(-20),mode:$('mode').value,len:$('len').value,lang:$('lang').value,name:user})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong. Please try again.');
  history.push({role:'user',text},{role:'model',text:j.reply});saveHist();add('SPARKX',j.reply);vib(15);speak(j.reply)
 }catch(e){if(e.name==='AbortError'){set('idle');return}showErr(e.message==='Failed to fetch'?'No connection. Please check your internet.':e.message);if(live&&!/hiccup|busy|many/i.test(e.message))endLive();else set('idle')}
 finally{ctrl=null}}
function submit(t){t=(t||'').trim();if(!t){set('idle');showErr("I didn't catch that. Tap the mic and try again.");return}
 if(state==='thinking')return;add('YOU',t);ask(t)}

// ---- mic level (orb reacts) ----
async function meter(){if(an||!navigator.mediaDevices)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
 ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(stream).connect(an);
 const b=new Uint8Array(an.frequencyBinCount);orb.classList.add('lv');
 (function t(){an.getByteFrequencyData(b);let s=0;for(const v of b)s+=v;orb.style.setProperty('--lv',Math.min(1,s/b.length/60));raf=requestAnimationFrame(t)})()}catch{}}
function unmeter(){cancelAnimationFrame(raf);orb.classList.remove('lv');if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)try{ac.close()}catch{}stream=ac=an=null}

// ---- speech recognition ----
const ERR={'not-allowed':'Mic blocked. Allow the microphone in browser settings and try again.','service-not-allowed':'Mic blocked. Allow the microphone in browser settings and try again.','audio-capture':'No microphone found.','network':'Speech recognition needs internet. Please retry.','language-not-supported':'That language is not supported by this browser.'};
function startListening(){
 if(!SR){showErr('Voice input is not supported in this browser — you can type instead.');showTypeBox();endLive();return}
 if(state==='listening'){cancelled=false;rec&&rec.stop();return}
 if(state==='thinking'||state==='transcribing'||rec)return;
 stopSpeaking();showErr('');heard='';cap.textContent='';cancelled=false;
 try{rec=new SR()}catch{showErr('Could not start voice input.');endLive();return}
 rec.lang=$('lang').value==='ta'?'ta-IN':'en-IN';rec.interimResults=true;rec.continuous=false;
 let failed=false;
 rec.onstart=()=>{set('listening');vib(20);meter()};
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;heard=t.trim();if($('caps').checked)cap.textContent=heard};
 rec.onerror=e=>{if(e.error==='aborted'||(e.error==='no-speech'&&live))return;failed=true;showErr(e.error==='no-speech'?"I didn't hear anything. Tap the mic and try again.":(ERR[e.error]||'Voice input error. Please try again.'));if(live)endLive()};
 rec.onend=()=>{rec=null;cap.textContent='';if(!live)unmeter();
  if(cancelled||failed){set('idle');return}
  if(!heard&&live){if(++noSp>=2){endLive('Live talk ended — I did not hear you.')}else set('idle');return}
  noSp=0;set('transcribing');setTimeout(()=>submit(heard),120)};
 try{rec.start()}catch{rec=null;showErr('Could not start the microphone.');endLive();set('idle')}}
function cancelListening(){cancelled=true;if(rec)try{rec.abort()}catch{}}
function endLive(msg){live=false;livebtn.classList.remove('on');livebtn.setAttribute('aria-pressed','false');livebtn.textContent='🎧 Live talk';
 cancelListening();if(ctrl)ctrl.abort();stopSpeaking();unmeter();if(state!=='idle')set('idle');else statusEl.textContent=LABEL.idle;if(msg)showErr(msg)}
livebtn.onclick=()=>{if(live){endLive();return}if(!SR){showErr('Live talk needs Chrome, Edge or Safari.');return}
 live=true;noSp=0;livebtn.classList.add('on');livebtn.setAttribute('aria-pressed','true');livebtn.textContent='⏹ End live talk';showErr('');
 if(state==='idle')startListening();else if(state==='speaking')stopSpeaking()};
mic.onclick=()=>{if(state==='idle'||state==='speaking'||state==='listening')startListening()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){endLive();$('panel').classList.remove('open')}});

// ---- typing fallback ----
function showTypeBox(){if($('tb'))return;const f=document.createElement('div');f.id='tb';f.style.cssText='display:flex;gap:8px;width:100%;margin-top:8px';
 const i=document.createElement('input');i.setAttribute('aria-label','Type your message');i.placeholder='Type to SparkX…';i.maxLength=2000;
 i.style.cssText='flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass)';
 const b=document.createElement('button');b.className='icon';b.textContent='Send';
 const go=()=>{const t=i.value;i.value='';if(state==='idle'&&t.trim())submit(t)};b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};f.append(i,b);cap.after(f)}

const SUG=['Enna panra?','Explain Python simply','Tell me a short story','Motivate me for today','Today romba tired ah irukken'];
SUG.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(state==='idle')submit(t)};$('sug').append(b)});
// ---- settings ----
const panel=$('panel');
$('gear').onclick=()=>{const o=!panel.classList.contains('open');panel.classList.toggle('open',o);$('gear').setAttribute('aria-expanded',o);if(o)$('close').focus()};
$('close').onclick=()=>{panel.classList.remove('open');$('gear').focus()};
$('stop').onclick=stopSpeaking;
$('clear').onclick=()=>{endLive();history=[];saveHist();log.innerHTML='';showErr('')};
$('export').onclick=()=>{const t=history.map(m=>(m.role==='user'?'YOU: ':'SPARKX: ')+m.text).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='sparkx-chat.txt';a.click()};
for(const [id,def] of [['mode','friend'],['lang','auto'],['len','normal'],['theme','violet'],['rate','1'],['vol','1']]){$(id).value=ls.g(id,def);$(id).onchange=$(id).oninput=e=>ls.s(id,e.target.value)}
const applyTheme=()=>{document.documentElement.dataset.t=$('theme').value};applyTheme();$('theme').addEventListener('change',applyTheme);
for(const id of ['auto','caps','hap','tbar']){$(id).checked=ls.g(id,id==='tbar'?'0':'1')==='1';$(id).onchange=e=>{ls.s(id,e.target.checked?'1':'0');if(id==='auto'&&!e.target.checked)stopSpeaking();if(id==='tbar')setBar()}}
