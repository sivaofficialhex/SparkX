<!doctype html>
<html lang="en" data-th="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SparkX — Talk. Listen. Understand.</title>
<meta name="description" content="SparkX is a voice-first AI companion that listens, understands and responds naturally.">
<meta property="og:title" content="SparkX — Talk. Listen. Understand."><meta property="og:description" content="SparkX is a voice-first AI companion that listens, understands and responds naturally."><meta property="og:type" content="website">
<meta name="theme-color" content="#0b0b14"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0b0b14;--c1:rgba(255,255,255,.06);--ln:rgba(255,255,255,.1);--tx:#eceaff;--dim:#8e8cb8;--a:#22d3ee;--b:#a78bfa}
html[data-th=midnight]{--bg:#070b1f}html[data-th=amoled]{--bg:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.logo{width:28px;height:28px}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 18px 8px}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:.14em}#net{font-size:.75rem;color:#fb7185}
main{flex:1;position:relative;overflow:hidden}.view{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:0 16px}
.view.on{display:flex;animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(14px)}}
nav{display:flex;margin:0 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--c1);border:1px solid var(--ln);border-radius:22px;backdrop-filter:blur(16px)}
nav button{flex:1;padding:10px 0 8px;color:var(--dim);font-size:.72rem;display:grid;gap:2px;justify-items:center;transition:color .2s,transform .15s}nav button b{font-size:1.2rem;font-weight:400}
nav button.on{color:var(--a)}nav button:active{transform:scale(.9)}
#v-voice{align-items:center;justify-content:center;text-align:center;overflow:hidden}#cv{width:100%;flex:1;min-height:0}
#st{font-size:1.25rem;letter-spacing:.06em}#cap{color:var(--dim);min-height:1.5em;max-width:90%;font-style:italic;margin:6px 0}#err{color:#fda4af;min-height:1.3em;font-size:.9rem}
#mic{width:76px;height:76px;border-radius:50%;margin:8px 0 16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 0 34px rgba(34,211,238,.45);transition:transform .15s,box-shadow .3s;color:#061018;font-size:1.7rem}
#mic:active{transform:scale(.92)}#mic.on{background:#e11d48;color:#fff;box-shadow:0 0 40px rgba(225,29,72,.6)}#mic:disabled{opacity:.4}
#msgs{flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .25s}.m.u{align-self:flex-end;background:linear-gradient(135deg,#0e7490,#6d28d9);border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--c1);border:1px solid var(--ln);border-bottom-left-radius:6px}.m small{display:block;margin-top:6px;color:var(--dim);font-size:.75rem}.m small button{color:var(--a);margin-right:12px;font-size:.78rem}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--a);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-6px);opacity:.4}}
.bar{display:flex;gap:8px;padding:8px 0}.bar input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--ln);background:var(--c1)}.bar button{width:46px;border-radius:50%;background:var(--c1);border:1px solid var(--ln)}#snd{background:linear-gradient(135deg,var(--a),var(--b));color:#061018}
.empty{margin:auto;text-align:center;color:var(--dim)}.card{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:0 0 10px}
.card .r{display:flex;justify-content:space-between;gap:8px;align-items:center}.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{color:var(--dim)}.card .ac button{color:var(--dim);padding:4px 8px}
#hs{margin:8px 0 12px;padding:12px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--c1);width:100%}
.h{margin:18px 4px 6px;font-size:.72rem;letter-spacing:.16em;color:var(--a)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row select,.row input[type=text]{background:#0f0e22;border:1px solid var(--ln);border-radius:10px;padding:8px;max-width:55%}.seg{display:flex;gap:6px}.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--ln);color:var(--dim)}.seg .on{background:var(--a);color:#061018;border-color:var(--a)}
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c1)}.btn.d{color:#fda4af}
#sp{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:9;transition:opacity .5s}#sp.out{opacity:0;pointer-events:none}
#sp>*{grid-area:1/1}.dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 20px 6px var(--a);animation:dot 1.9s both}@keyframes dot{0%{transform:scale(0);opacity:0}15%{transform:scale(1);opacity:1}55%{transform:scale(1)}100%{transform:scale(0);opacity:0}}
.ring{width:40px;height:40px;border:2px solid var(--a);border-radius:50%;opacity:0;animation:rg 1.6s .3s ease-out both}.ring.r2{border-color:var(--b);animation-delay:.6s}@keyframes rg{0%{transform:scale(.2);opacity:.9}100%{transform:scale(11);opacity:0}}
.big{width:96px;height:96px;opacity:0;animation:pop 1s 1.1s both}@keyframes pop{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
.nm{margin-top:150px;text-align:center;opacity:0;animation:fu 1s 1.5s both}.nm b{font-size:1.8rem;letter-spacing:.35em}.nm small{display:block;color:var(--dim)}@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
</style></head>
<body>
<div id="sp"><div class="dot"></div><i class="ring"></i><i class="ring r2"></i>
<svg class="big" viewBox="0 0 64 64"><use href="#spark"/></svg><div class="nm"><b>SPARKX</b><small>Talk. Listen. Understand.</small></div></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<path id="spark" fill="url(#gr)" d="M32 4C34 22 42 30 60 32 42 34 34 42 32 60 30 42 22 34 4 32 22 30 30 22 32 4Z"/></defs></svg>
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 64 64"><use href="#spark"/></svg>SPARKX</div><span id="net" role="status"></span></header>
<main>
<section class="view on" id="v-voice" aria-label="Voice mode"><canvas id="cv" aria-hidden="true"></canvas><div id="st" role="status" aria-live="polite">Tap to talk</div><p id="cap" aria-live="polite"></p><p id="err" role="alert"></p>
<button id="mic" aria-label="Start voice conversation">🎙</button></section>
<section class="view" id="v-chat" aria-label="Chat mode"><div id="msgs" aria-live="polite"></div>
<div class="bar"><input id="ti" maxlength="2000" placeholder="Message SparkX…" aria-label="Message"><button id="vm" aria-label="Voice input">🎙</button><button id="snd" aria-label="Send">➤</button></div></section>
<section class="view" id="v-hist" aria-label="History"><input id="hs" type="search" placeholder="Search chats…" aria-label="Search chats"><div id="hl"></div></section>
<section class="view" id="v-set" aria-label="Settings">
<p class="h">GENERAL</p><div class="card"><div class="row"><label for="k-name">Your name</label><input id="k-name" type="text" data-k="name" maxlength="30"></div>
<div class="row"><label for="k-mode">Personality</label><select id="k-mode" data-k="mode"><option value="friend">Friend</option><option value="tutor">Tutor</option><option value="coach">Coach</option></select></div>
<div class="row"><label for="k-len">Reply length</label><select id="k-len" data-k="len"><option value="short">Short</option><option value="normal">Normal</option><option value="detailed">Detailed</option></select></div></div>
<p class="h">VOICE</p><div class="card"><div class="row"><label for="voice">Voice</label><select id="voice" data-k="voice"></select></div>
<div class="row"><label for="k-rate">Speed</label><input id="k-rate" type="range" min="0.6" max="1.6" step="0.1" data-k="rate"></div>
<div class="row"><label for="k-vol">Volume</label><input id="k-vol" type="range" min="0" max="1" step="0.05" data-k="vol"></div>
<div class="row"><label for="k-auto">Auto speak</label><input id="k-auto" type="checkbox" data-k="auto"></div></div>
<p class="h">APPEARANCE</p><div class="card"><div class="seg" id="th"><button data-th="dark">Dark</button><button data-th="midnight">Midnight</button><button data-th="amoled">AMOLED</button></div></div>
<p class="h">LANGUAGE</p><div class="card"><div class="row"><label for="k-lang">Talk in</label><select id="k-lang" data-k="lang"><option value="auto">Auto</option><option value="en">English</option><option value="tanglish">Tanglish</option><option value="ta">Tamil</option></select></div></div>
<p class="h">MEMORY</p><div class="card"><div class="row"><span>Current chat</span><button class="btn" id="forget">Clear</button></div><div class="row"><span>All chats</span><button class="btn d" id="wipe">Delete all</button></div></div>
<p class="h">ABOUT</p><div class="card"><small>SparkX v3 · Talk. Listen. Understand.<br>Chats are stored on this device only.</small></div><div style="height:12px"></div></section>
</main>
<nav aria-label="Main"><button data-v="voice" class="on"><b>◉</b>Voice</button><button data-v="chat"><b>✦</b>Chat</button><button data-v="hist"><b>☰</b>History</button><button data-v="set"><b>⚙</b>Settings</button></nav>
<script>
(()=>{
const $=id=>document.getElementById(id),Q=s=>[...document.querySelectorAll(s)];
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem('sx3_'+k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem('sx3_'+k,JSON.stringify(v))}catch{}}};
const cfg=Object.assign({name:'',mode:'friend',len:'normal',voice:'',rate:1,vol:1,auto:true,lang:'auto',theme:'dark'},LS.g('cfg',{}));
let convs=LS.g('convs',[]),cur=LS.g('cur',null),state='idle',view='voice',live=false,noSp=0,rec=null,heard='',cancelled=false,voices=[],ctrl=null,stream,ac,an,lv=0,tgt=0,viaVoice=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,synth=window.speechSynthesis;
const LB={idle:'Tap to talk',listening:'Listening…',thinking:'Thinking…',speaking:'Speaking…',error:'Something went wrong',offline:'Offline'};
const COL={idle:'#a78bfa',listening:'#22d3ee',thinking:'#e879f9',speaking:'#34d399',error:'#fb7185',offline:'#64748b'};
const save=()=>{LS.s('convs',convs.slice(0,60));LS.s('cur',cur)};
const strip=t=>t.replace(/```[\s\S]*?```/g,' ').replace(/`([^`]*)`/g,'$1').replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^\s{0,3}#{1,6}\s*/gm,'').replace(/(\*\*|__|\*|_|~~)/g,'').replace(/^\s*[-*+•]\s+/gm,'').replace(/\s+/g,' ').trim();
const conv=()=>{let c=convs.find(x=>x.id===cur);if(!c){c={id:Date.now()+'',title:'New chat',msgs:[],t:Date.now()};convs.unshift(c);cur=c.id;save()}return c};
function err(t){$('err').textContent=t||''}
function setS(s){state=s;if(!navigator.onLine&&s==='idle')state='offline';$('st').textContent=live&&state==='idle'?'Go ahead…':LB[state];$('mic').classList.toggle('on',live);
 $('mic').textContent=live?'⏹':'🎙';$('mic').setAttribute('aria-label',live?'End voice conversation':'Start voice conversation');
 if(s==='idle'&&live)setTimeout(()=>{if(live&&state==='idle')listen()},350)}
// ---- navigation ----
function go(v){view=v;Q('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));Q('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='chat')renderChat();if(v==='hist')renderHist();if(v!=='voice'&&live)endLive()}
Q('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
// ---- chat ----
function bubble(m){const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');const p=document.createElement('span');p.textContent=m.role==='user'?m.text:strip(m.text);d.append(p);
 if(m.role!=='user'){const s=document.createElement('small'),c=document.createElement('button');c.textContent='Copy';c.onclick=()=>{try{navigator.clipboard.writeText(p.textContent);c.textContent='Copied ✓'}catch{}};
  const r=document.createElement('button');r.textContent='Speak';r.onclick=()=>speak(m.text);s.append(c,r);d.append(s)}return d}
function renderChat(){const box=$('msgs');box.innerHTML='';const c=conv();if(!c.msgs.length){box.innerHTML='<div class="empty"><svg width="48" height="48" viewBox="0 0 64 64"><use href="#spark"/></svg><p>Ask me anything.<br>Type or tap the mic.</p></div>'}
 else c.msgs.forEach(m=>box.append(bubble(m)));box.scrollTop=box.scrollHeight}
function addMsg(role,text){const c=conv();c.msgs.push({role,text});if(role==='user'&&c.title==='New chat')c.title=text.slice(0,40);c.t=Date.now();save();
 if(view==='chat'){if(c.msgs.length===1)$('msgs').innerHTML='';$('msgs').append(bubble({role,text}));$('msgs').scrollTop=1e9}}
async function ask(text){setS('thinking');err('');addMsg('user',text);const dots=document.createElement('div');dots.className='m a dots';dots.innerHTML='<i></i><i></i><i></i>';
 if(view==='chat'){$('msgs').append(dots);$('msgs').scrollTop=1e9}ctrl=new AbortController();const c=conv();
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({message:text,conversation:c.msgs.slice(0,-1).slice(-20).map(m=>({role:m.role,text:m.text})),mode:cfg.mode,len:cfg.len,lang:cfg.lang,name:cfg.name})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong. Please try again.');dots.remove();addMsg('model',j.reply);
  if(cfg.auto&&(view==='voice'||viaVoice))speak(j.reply);else setS('idle')}
 catch(e){dots.remove();if(e.name==='AbortError'){setS('idle');return}err(e.message==='Failed to fetch'?'No connection. Please check your internet.':e.message);setS('error');
  setTimeout(()=>{if(state==='error')setS('idle')},1500);if(live&&!/hiccup|busy|many/i.test(e.message))endLive()}finally{ctrl=null}}
function send(t,v){t=(t||'').trim();if(!t){setS('idle');err("I didn't catch that. Try again.");return}if(state==='thinking')return;viaVoice=!!v;ask(t)}
$('snd').onclick=()=>{const t=$('ti').value;$('ti').value='';if(state==='idle'||state==='offline')send(t,false)};$('ti').onkeydown=e=>{if(e.key==='Enter')$('snd').click()};
$('vm').onclick=()=>{if(state==='idle')listen(true)};
// ---- history ----
function renderHist(){const q=$('hs').value.toLowerCase(),box=$('hl');box.innerHTML='';const L=convs.filter(c=>c.msgs.length&&(c.title+c.msgs.map(m=>m.text).join(' ')).toLowerCase().includes(q));
 if(!L.length){box.innerHTML='<div class="empty">No chats yet.</div>';return}
 L.forEach(c=>{const d=document.createElement('div');d.className='card';const last=c.msgs[c.msgs.length-1].text;d.innerHTML='<div class="r"><div style="min-width:0"><b></b><small></small></div><div class="ac"><button aria-label="Rename">✎</button><button aria-label="Delete">🗑</button></div></div>';
  d.querySelector('b').textContent=c.title;d.querySelector('small').textContent=new Date(c.t).toLocaleDateString()+' · '+strip(last).slice(0,50);
  d.querySelector('.r>div').onclick=()=>{cur=c.id;save();go('chat')};const [rn,dl]=d.querySelectorAll('.ac button');
  rn.onclick=()=>{const n=prompt('Rename chat',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,60);save();renderHist()}};
  dl.onclick=()=>{if(confirm('Delete this chat?')){convs=convs.filter(x=>x!==c);if(cur===c.id)cur=null;save();renderHist()}};box.append(d)})}
$('hs').oninput=renderHist;
// ---- settings ----
Q('[data-k]').forEach(e=>{const k=e.dataset.k;if(e.type==='checkbox')e.checked=cfg[k];else e.value=cfg[k];
 e.addEventListener('change',()=>{cfg[k]=e.type==='checkbox'?e.checked:e.type==='range'?+e.value:e.value;LS.s('cfg',cfg);if(k==='auto'&&!cfg.auto)stopSpeak()})});
Q('#th button').forEach(b=>{b.onclick=()=>{cfg.theme=b.dataset.th;LS.s('cfg',cfg);theme()}});
function theme(){document.documentElement.dataset.th=cfg.theme;Q('#th button').forEach(b=>b.classList.toggle('on',b.dataset.th===cfg.theme))}theme();
$('forget').onclick=()=>{endLive();const c=conv();c.msgs=[];c.title='New chat';save();renderChat()};
$('wipe').onclick=()=>{if(!confirm('Delete all chats from this device?'))return;endLive();convs=[];cur=null;save();renderChat();renderHist()};
// ---- speech out ----
function loadV(){voices=synth?synth.getVoices():[];const s=$('voice');s.innerHTML='';s.add(new Option('Auto (best match)',''));voices.forEach(v=>s.add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));s.value=cfg.voice}
if(synth){loadV();synth.onvoiceschanged=loadV}
function stopSpeak(){if(synth)synth.cancel();if(state==='speaking')setS('idle')}
function speak(text){const t=strip(text);if(!synth||!t){setS('idle');return}
 try{synth.cancel();const u=new SpeechSynthesisUtterance(t);let v=voices.find(x=>x.voiceURI===cfg.voice);
  if(!v){const ta=/[\u0B80-\u0BFF]/.test(t)||cfg.lang==='ta';for(const p of ta?['ta']:['en-IN','en']){v=voices.find(x=>x.lang.startsWith(p));if(v)break}}
  if(v){u.voice=v;u.lang=v.lang}u.rate=cfg.rate;u.volume=cfg.vol;u.onstart=()=>setS('speaking');u.onend=()=>{if(state==='speaking')setS('idle')};
  u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')err('Voice playback failed. Reply is shown as text.');if(state==='speaking')setS('idle')};setS('speaking');synth.speak(u)}
 catch{err('Voice playback failed. Reply is shown as text.');setS('idle')}}
// ---- mic ----
async function meter(){if(an||!navigator.mediaDevices)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;
 ac.createMediaStreamSource(stream).connect(an);const b=new Uint8Array(an.frequencyBinCount);(function t(){if(!an)return;an.getByteFrequencyData(b);let s=0;for(const x of b)s+=x;tgt=Math.min(1,s/b.length/55);requestAnimationFrame(t)})()}catch{}}
function unmeter(){an=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)try{ac.close()}catch{}stream=ac=null}
const ERR={'not-allowed':'Mic blocked. Allow the microphone in browser settings.','service-not-allowed':'Mic blocked. Allow the microphone in browser settings.','audio-capture':'No microphone found.','network':'Speech recognition needs internet.'};
function listen(chat){if(!SR){err('Voice input is not supported in this browser. Use Chrome, Edge or Safari, or type in Chat.');endLive();return}
 if(state==='listening'){cancelled=false;rec&&rec.stop();return}if(state==='thinking'||rec||state==='offline')return;
 stopSpeak();err('');heard='';$('cap').textContent='';cancelled=false;let fail=false;
 try{rec=new SR()}catch{err('Could not start voice input.');endLive();return}
 rec.lang=cfg.lang==='ta'?'ta-IN':'en-IN';rec.interimResults=true;rec.continuous=false;
 rec.onstart=()=>{setS('listening');if(navigator.vibrate)try{navigator.vibrate(15)}catch{}meter()};
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;heard=t.trim();$('cap').textContent=heard;if(chat)$('ti').value=heard};
 rec.onerror=e=>{if(e.error==='aborted'||(e.error==='no-speech'&&live))return;fail=true;err(e.error==='no-speech'?"I didn't hear anything.":(ERR[e.error]||'Voice input error. Try again.'));setS('error');setTimeout(()=>{if(state==='error')setS('idle')},1200);if(live)endLive()};
 rec.onend=()=>{rec=null;$('cap').textContent='';if(!live)unmeter();if(cancelled||fail){if(state==='listening')setS('idle');return}
  if(!heard){if(live&&++noSp>=2)endLive('Voice chat ended. I did not hear you.');else setS('idle');return}noSp=0;if(chat)$('ti').value='';send(heard,true)};
 try{rec.start()}catch{rec=null;err('Could not start the microphone.');endLive();setS('idle')}}
function endLive(m){live=false;cancelled=true;if(rec)try{rec.abort()}catch{}if(ctrl)ctrl.abort();if(synth)synth.cancel();unmeter();state='idle';setS('idle');if(m)err(m)}
$('mic').onclick=()=>{if(live){endLive();return}if(!SR){listen();return}live=true;noSp=0;err('');if(state==='speaking')stopSpeak();else if(state==='idle')listen();else setS(state)};
// ---- holographic core ----
const cv=$('cv'),cx=cv.getContext('2d'),P=[];for(let i=0;i<240;i++){const y=1-2*(i+.5)/240,r=Math.sqrt(1-y*y),a=i*2.399963;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
function draw(t){requestAnimationFrame(draw);if(view!=='voice')return;const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
 if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d}cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);
 if(state==='speaking')tgt=.4+.3*Math.sin(t/120)+.2*Math.sin(t/47);else if(state!=='listening')tgt=state==='thinking'?.25:.06;lv+=(tgt-lv)*.18;
 const col=COL[state],R=Math.min(w,h)*.3*(1+lv*.2),rot=t/(state==='thinking'?450:2000),cs=Math.cos(rot),sn=Math.sin(rot),X=w/2,Y=h/2;
 const g=cx.createRadialGradient(X,Y,0,X,Y,R*1.5);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,w,h);
 cx.fillStyle=col;for(const p of P){const x=p[0]*cs+p[2]*sn,z=-p[0]*sn+p[2]*cs,k=1+lv*.25*Math.sin(t/80+p[1]*8),f=(z+1)/2;cx.globalAlpha=.2+.8*f;cx.beginPath();cx.arc(X+x*R*k,Y+p[1]*R*k,.9+1.7*f*(1+lv),0,6.283);cx.fill()}
 cx.globalAlpha=.5;cx.strokeStyle=col;cx.lineWidth=1.5;cx.beginPath();for(let i=0;i<=60;i++){const a=i/60*6.283,r=R*(1.18+lv*.25*Math.sin(a*5+t/150));cx[i?'lineTo':'moveTo'](X+Math.cos(a)*r,Y+Math.sin(a)*r)}cx.stroke()}
requestAnimationFrame(draw);

const net=()=>{$('net').textContent=navigator.onLine?'':'Offline';if(!navigator.onLine){if(live)endLive();setS('idle')}else if(state==='offline')setS('idle')};
addEventListener('online',net);addEventListener('offline',net);addEventListener('pagehide',()=>{endLive()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
net();setS('idle');setTimeout(()=>{$('sp').classList.add('out');setTimeout(()=>$('sp').remove(),600)},2900);
